# Unseen V2 research holdout; keep separate from the frozen development benchmark.
- case_id: H01
  domain: healthcare
  evidence:
    - {evidence_id: E1, source_id: source-a, location: triage, content: "current triage wait is 18 minutes"}
    - {evidence_id: E2, source_id: source-b, location: triage, content: "current triage wait is 27 minutes"}
  fact_needs:
    - {subject: triage_queue, dimension: wait_minutes, value_type: number}
  gold_claims:
    - {subject: triage_queue, predicate: wait_minutes, value: 18, value_type: number, scope: {}, modality: OBSERVED, cardinality: SINGLE, evidence_ids: [E1]}
    - {subject: triage_queue, predicate: wait_minutes, value: 27, value_type: number, scope: {}, modality: OBSERVED, cardinality: SINGLE, evidence_ids: [E2]}
  gold_relations:
    - {left_evidence_ids: [E1], right_evidence_ids: [E2], relation: CONFLICTING}
  gold_summary: UNRESOLVED
  reason: two current scalar observations disagree
