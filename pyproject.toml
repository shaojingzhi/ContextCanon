[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextcanon"
version = "0.1.0a0"
description = "Compile conflicting project knowledge into verifiable context for AI agents."
readme = "docs/SPEC.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
contextcanon = "contextcanon.cli:main"

[tool.setuptools.packages.find]
include = ["contextcanon*"]
