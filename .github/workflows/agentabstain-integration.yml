name: AgentAbstain Gates 1-3

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AGENTABSTAIN_REVISION: f581249704b26804e28a39e37396f1be00b71a4d
  AGENTABSTAIN_DATA_REVISION: 842228426c2a703347396501af61c7890972c7ee

jobs:
  official-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AntiQuality/agentabstain
          ref: f581249704b26804e28a39e37396f1be00b71a4d
          path: agentabstain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install -r agentabstain/requirements.txt
      - name: Download pinned public benchmark data
        env:
          HF_DATASET_REVISION: 842228426c2a703347396501af61c7890972c7ee
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              "antiquality/agentabstain",
              repo_type="dataset",
              revision="842228426c2a703347396501af61c7890972c7ee",
              local_dir="agentabstain-data",
              allow_patterns=[
                  "environments/**",
                  "tasks/conflicting_evidence/preview_008/**",
                  "tasks/conflicting_evidence/preview_013/**",
                  "tasks/conflicting_evidence/preview_015/**",
              ],
          )
          PY
      - name: Run official deterministic gates
        env:
          AGENTABSTAIN_REPO: ${{ github.workspace }}/agentabstain
          AGENTABSTAIN_DATA: ${{ github.workspace }}/agentabstain-data
        run: python -m experiments.agentabstain.official_gate --repo "$AGENTABSTAIN_REPO" --data "$AGENTABSTAIN_DATA"
